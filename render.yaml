services:
  - type: web
    name: ayuq-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ayuq-postgres
          property: connectionString

databases:
  - name: ayuq-postgres
    plan: basic-256mb
    databaseName: ayuq
    user: ayuq
